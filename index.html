<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#181825">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Браузер">
<meta name="mobile-web-app-capable" content="yes">
<title>Браузер</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    height:100%;
    overflow:hidden;
    background:#181825;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#cdd6f4;
    overscroll-behavior:none;
  }

  body {
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---------- Вкладки ---------- */
  .tabs {
    display:flex;
    gap:6px;
    padding:8px 8px 6px;
    overflow-x:auto;
    scrollbar-width:none;
    background:#11111b;
    -webkit-overflow-scrolling:touch;
    flex-shrink:0;
  }
  .tabs::-webkit-scrollbar { display:none; }

  .tab {
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
    max-width:160px;
    min-height:38px;
    padding:0 10px;
    border-radius:10px;
    background:#1e1e2e;
    font-size:13px;
    color:#9399b2;
    transition:background .15s;
  }
  .tab.active { background:#313244; color:#fff; }

  .tab-title {
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:110px;
  }

  .tab-close {
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    font-size:12px;
    flex-shrink:0;
  }
  .tab-close:active { background:#f38ba8; color:#111; }

  .tab-new {
    min-width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    border:none;
    border-radius:10px;
    background:#1e1e2e;
    color:#9399b2;
    font-size:20px;
    flex-shrink:0;
  }
  .tab-new:active { background:#313244; color:#fff; }

  /* ---------- Адресная строка ---------- */
  .bar {
    display:flex;
    gap:6px;
    padding:6px 8px;
    background:#181825;
    flex-shrink:0;
  }

  .bar-btn {
    width:40px; height:40px;
    border:none;
    border-radius:10px;
    background:#1e1e2e;
    color:#cdd6f4;
    font-size:17px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:background .12s;
  }
  .bar-btn:active { background:#313244; }
  .bar-btn:disabled { opacity:.3; }

  .url-wrap {
    flex:1;
    display:flex;
    align-items:center;
    background:#11111b;
    border:1px solid #313244;
    border-radius:10px;
    padding:0 4px 0 12px;
    height:40px;
    min-width:0;
  }
  .url-wrap:focus-within { border-color:#89b4fa; }

  #url {
    flex:1;
    min-width:0;
    background:none;
    border:none;
    outline:none;
    color:#fff;
    font-size:14px;
  }
  #url::placeholder { color:#585b70; }

  .star {
    width:34px; height:34px;
    border:none;
    border-radius:8px;
    background:none;
    color:#666;
    font-size:18px;
    flex-shrink:0;
  }
  .star:active { background:#313244; }

  /* ---------- Сцена ---------- */
  .stage {
    flex:1;
    position:relative;
    background:#11111b;
    overflow:hidden;
  }

  .view {
    position:absolute;
    inset:0;
    display:none;
  }
  .view.active { display:block; }

  .view iframe {
    width:100%; height:100%;
    border:none;
    background:#fff;
  }

  /* ---------- Стартовая ---------- */
  .start {
    height:100%;
    overflow-y:auto;
    padding:40px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:radial-gradient(circle at 50% 0%, #262636 0%, #11111b 65%);
    -webkit-overflow-scrolling:touch;
  }

  .start h1 {
    font-size:24px;
    color:#fff;
    margin-bottom:24px;
    font-weight:600;
  }

  .start-search {
    display:flex;
    width:100%;
    max-width:520px;
    margin-bottom:36px;
  }
  .start-search input {
    flex:1;
    min-width:0;
    padding:13px 16px;
    border:1px solid #313244;
    border-right:none;
    border-radius:12px 0 0 12px;
    background:#11111b;
    color:#fff;
    font-size:16px;
    outline:none;
  }
  .start-search input:focus { border-color:#89b4fa; }
  .start-search button {
    padding:0 22px;
    border:none;
    border-radius:0 12px 12px 0;
    background:#89b4fa;
    color:#11111b;
    font-size:15px;
    font-weight:600;
  }
  .start-search button:active { background:#a5c8ff; }

  .start h2 {
    color:#585b70;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:12px;
  }

  .bms {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(80px,1fr));
    gap:10px;
    width:100%;
    max-width:560px;
  }

  .bm {
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:12px 6px;
    background:#1e1e2e;
    border:1px solid #313244;
    border-radius:12px;
  }
  .bm:active { background:#262636; }

  .bm-icon {
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    background:#313244;
    font-size:18px;
  }
  .bm-name {
    font-size:11px;
    color:#9399b2;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .bm-del {
    position:absolute;
    top:2px; right:2px;
    width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
    border:none;
    border-radius:50%;
    background:#313244;
    color:#cdd6f4;
    font-size:11px;
  }
  .bm-del:active { background:#f38ba8; color:#111; }

  /* ---------- Тост ---------- */
  .toast {
    position:fixed;
    left:50%;
    bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translate(-50%, 80px);
    background:#313244;
    color:#fff;
    padding:10px 20px;
    border-radius:10px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:999;
    max-width:90vw;
    text-align:center;
  }
  .toast.show { transform:translate(-50%, 0); opacity:1; }

  /* ---------- Меню ---------- */
  .menu {
    position:fixed;
    right:8px;
    top:calc(96px + env(safe-area-inset-top));
    background:#1e1e2e;
    border:1px solid #313244;
    border-radius:12px;
    padding:6px;
    min-width:200px;
    box-shadow:0 12px 40px rgba(0,0,0,.6);
    z-index:200;
    display:none;
  }
  .menu.open { display:block; }

  .menu-item {
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:8px;
    font-size:14px;
    color:#cdd6f4;
  }
  .menu-item:active { background:#313244; }
  .menu-sep { height:1px; background:#313244; margin:4px 8px; }
</style>
</head>
<body>

<!-- Вкладки -->
<div class="tabs" id="tabs">
  <button class="tab-new" id="newTabBtn" aria-label="Новая вкладка">+</button>
</div>

<!-- Панель -->
<div class="bar">
  <button class="bar-btn" id="backBtn" aria-label="Назад">◀</button>
  <div class="url-wrap">
    <input id="url" type="text" placeholder="Поиск в DuckDuckGo или URL"
           autocomplete="off" autocorrect="off" spellcheck="false" inputmode="url">
    <button class="star" id="starBtn" aria-label="В закладки">☆</button>
  </div>
  <button class="bar-btn" id="menuBtn" aria-label="Меню">⋮</button>
</div>

<!-- Сцена -->
<div class="stage" id="stage"></div>

<!-- Меню -->
<div class="menu" id="menu">
  <div class="menu-item" data-action="new-tab">➕ Новая вкладка</div>
  <div class="menu-item" data-action="reload">⟳ Обновить</div>
  <div class="menu-item" data-action="forward">▶ Вперёд</div>
  <div class="menu-item" data-action="bookmark">⭐ В закладки</div>
  <div class="menu-sep"></div>
  <div class="menu-item" data-action="home">⌂ Домой</div>
  <div class="menu-item" data-action="clear">🗑 Очистить историю</div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ============================================================
   Хранилище
   ============================================================ */
const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem('browser.' + k);
      return v ? JSON.parse(v) : d;
    } catch { return d; }
  },
  set(k, v) {
    try { localStorage.setItem('browser.' + k, JSON.stringify(v)); } catch {}
  }
};

/* ============================================================
   Состояние
   ============================================================ */
const state = {
  tabs: [],
  activeId: null,
  nextId: 1,
  bookmarks: store.get('bookmarks', [
    // Только сайты, которые разрешают открытие внутри iframe!
    { url:'https://ru.wikipedia.org',          name:'Википедия',   icon:'📖' },
    { url:'https://archive.org',               name:'Archive',     icon:'🏛️' },
    { url:'https://html.duckduckgo.com/html/', name:'DuckDuckGo',  icon:'🦆' },
    { url:'https://example.com',               name:'Example',     icon:'🧪' },
    { url:'https://developer.mozilla.org',     name:'MDN',         icon:'📚' },
    { url:'https://www.wikihow.com',           name:'wikiHow',     icon:'🛠️' }
  ]),
  history: store.get('history', [])
};

/* ============================================================
   Утилиты
   ============================================================ */
function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function toast(msg, ms = 1800) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

function domainOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch { return ''; }
}

function toUrl(input) {
  const s = input.trim();
  if (!s) return '';
  if (/^(https?|ftp|file):\/\//i.test(s)) return s;
  if (/^[\w-]+(\.[\w-]+)+(\/|$)/.test(s) || s.startsWith('localhost')) {
    return 'https://' + s;
  }
  
  // ИСПОЛЬЗУЕМ DUCKDUCKGO ВМЕСТО GOOGLE
  // html.duckduckgo.com отлично работает внутри iframe
  return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(s);
}

/* ============================================================
   Вкладки
   ============================================================ */
const stage = $('stage');
const tabsEl = $('tabs');

function newTab(url = null) {
  const id = state.nextId++;
  const tab = {
    id,
    url: '',
    title: 'Новая',
    history: [],
    hIndex: -1,
    iframe: null
  };
  state.tabs.push(tab);

  /* DOM вкладки */
  const tabEl = document.createElement('div');
  tabEl.className = 'tab';
  tabEl.dataset.id = id;
  tabEl.innerHTML = `
    <span class="tab-title">${esc(tab.title)}</span>
    <span class="tab-close">✕</span>
  `;
  tabEl.addEventListener('click', e => {
    if (e.target.classList.contains('tab-close')) {
      closeTab(id);
      return;
    }
    activateTab(id);
  });
  tabsEl.insertBefore(tabEl, $('newTabBtn'));

  /* DOM сцены */
  const viewEl = document.createElement('div');
  viewEl.className = 'view';
  viewEl.dataset.id = id;
  stage.appendChild(viewEl);

  if (url) {
    loadUrl(tab, toUrl(url));
  } else {
    renderStart(tab, viewEl);
  }

  activateTab(id);
  return tab;
}

function activateTab(id) {
  const tab = state.tabs.find(t => t.id === id);
  if (!tab) return;
  state.activeId = id;

  document.querySelectorAll('.tab').forEach(n =>
    n.classList.toggle('active', Number(n.dataset.id) === id));
  document.querySelectorAll('.view').forEach(n =>
    n.classList.toggle('active', Number(n.dataset.id) === id));

  $('url').value = tab.url;
  syncBar();
  syncStar();
}

function closeTab(id) {
  const i = state.tabs.findIndex(t => t.id === id);
  if (i === -1) return;
  const tab = state.tabs[i];

  if (tab.iframe) tab.iframe.remove();
  tabsEl.querySelector(`.tab[data-id="${id}"]`)?.remove();
  stage.querySelector(`.view[data-id="${id}"]`)?.remove();
  state.tabs.splice(i, 1);

  if (state.activeId === id) {
    const next = state.tabs[i] || state.tabs[i - 1] || state.tabs[0];
    if (next) activateTab(next.id);
    else newTab();
  }
}

function activeTab() {
  return state.tabs.find(t => t.id === state.activeId);
}

/* ============================================================
   Загрузка
   ============================================================ */
function loadUrl(tab, url, push = true) {
  if (!url) return;

  tab.url = url;
  tab.title = domainOf(url) || url;
  tabsEl.querySelector(`.tab[data-id="${tab.id}"] .tab-title`).textContent = tab.title;

  const viewEl = stage.querySelector(`.view[data-id="${tab.id}"]`);

  if (!tab.iframe) {
    tab.iframe = document.createElement('iframe');
    tab.iframe.setAttribute('referrerpolicy', 'no-referrer');
    viewEl.innerHTML = '';
    viewEl.appendChild(tab.iframe);
  }

  tab.iframe.src = url;

  if (push) {
    tab.history = tab.history.slice(0, tab.hIndex + 1);
    if (tab.history[tab.hIndex] !== url) {
      tab.history.push(url);
      tab.hIndex = tab.history.length - 1;
    }
  }

  state.history.push({ url, time: Date.now() });
  if (state.history.length > 300) state.history.shift();
  store.set('history', state.history);

  if (tab.id === state.activeId) {
    $('url').value = url;
    syncBar();
    syncStar();
  }
}

/* ============================================================
   Стартовая страница
   ============================================================ */
function renderStart(tab, viewEl) {
  tab.url = '';
  tab.title = 'Новая';
  tabsEl.querySelector(`.tab[data-id="${tab.id}"] .tab-title`).textContent = tab.title;

  const cards = state.bookmarks.length
    ? state.bookmarks.map((b, i) => `
        <div class="bm" data-url="${esc(b.url)}">
          <button class="bm-del" data-i="${i}">✕</button>
          <div class="bm-icon">${esc(b.icon || '🌐')}</div>
          <div class="bm-name">${esc(b.name || domainOf(b.url))}</div>
        </div>`).join('')
    : `<div style="grid-column:1/-1;text-align:center;color:#585b70;font-size:13px;padding:16px">
         Закладок пока нет
       </div>`;

  viewEl.innerHTML = `
    <div class="start">
      <h1>🌐 Браузер</h1>
      <div class="start-search">
        <input type="text" class="s-input" placeholder="Поиск в DuckDuckGo или URL"
               autocomplete="off" autocorrect="off" spellcheck="false" inputmode="url">
        <button class="s-go">Найти</button>
      </div>
      <h2>Закладки</h2>
      <div class="bms">${cards}</div>
    </div>
  `;

  const input = viewEl.querySelector('.s-input');
  const go = () => {
    const q = input.value.trim();
    if (q) loadUrl(tab, toUrl(q));
  };
  viewEl.querySelector('.s-go').addEventListener('click', go);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

  viewEl.querySelectorAll('.bm').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.classList.contains('bm-del')) return;
      loadUrl(tab, card.dataset.url);
    });
  });

  viewEl.querySelectorAll('.bm-del').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      state.bookmarks.splice(Number(btn.dataset.i), 1);
      store.set('bookmarks', state.bookmarks);
      renderStart(tab, viewEl);
      toast('Закладка удалена');
    });
  });
}

/* ============================================================
   Навигация
   ============================================================ */
function goBack() {
  const tab = activeTab();
  if (!tab || tab.hIndex <= 0) return;
  tab.hIndex--;
  loadUrl(tab, tab.history[tab.hIndex], false);
}

function goForward() {
  const tab = activeTab();
  if (!tab || tab.hIndex >= tab.history.length - 1) return;
  tab.hIndex++;
  loadUrl(tab, tab.history[tab.hIndex], false);
}

function reload() {
  const tab = activeTab();
  if (!tab) return;
  if (tab.iframe && tab.url) {
    tab.iframe.src = tab.url;
  } else {
    renderStart(tab, stage.querySelector(`.view[data-id="${tab.id}"]`));
    syncBar();
  }
}

function goHome() {
  const tab = activeTab();
  if (!tab) return;
  if (tab.iframe) { tab.iframe.remove(); tab.iframe = null; }
  renderStart(tab, stage.querySelector(`.view[data-id="${tab.id}"]`));
  $('url').value = '';
  syncBar();
  syncStar();
}

function syncBar() {
  const tab = activeTab();
  $('backBtn').disabled = !tab || tab.hIndex <= 0;
}

function syncStar() {
  const tab = activeTab();
  const star = $('starBtn');
  if (!tab || !tab.url) {
    star.textContent = '☆';
    star.style.color = '#666';
    return;
  }
  const has = state.bookmarks.some(b => b.url === tab.url);
  star.textContent = has ? '★' : '☆';
  star.style.color = has ? '#f9e2af' : '#666';
}

/* ============================================================
   Закладки
   ============================================================ */
function toggleBookmark() {
  const tab = activeTab();
  if (!tab || !tab.url) { toast('Сначала откройте страницу'); return; }

  const i = state.bookmarks.findIndex(b => b.url === tab.url);
  if (i >= 0) {
    state.bookmarks.splice(i, 1);
    toast('Удалено из закладок');
  } else {
    state.bookmarks.push({
      url: tab.url,
      name: tab.title || domainOf(tab.url),
      icon: '🌐'
    });
    toast('Добавлено в закладки ★');
  }
  store.set('bookmarks', state.bookmarks);
  syncStar();
}

/* ============================================================
   Обработчики UI
   ============================================================ */
$('newTabBtn').addEventListener('click', () => newTab());
$('backBtn').addEventListener('click', goBack);
$('starBtn').addEventListener('click', toggleBookmark);

$('url').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const tab = activeTab();
  if (!tab) return;
  const url = toUrl($('url').value);
  if (url) loadUrl(tab, url);
  $('url').blur();
});
$('url').addEventListener('focus', () => $('url').select());

/* Меню */
const menu = $('menu');
$('menuBtn').addEventListener('click', e => {
  e.stopPropagation();
  menu.classList.toggle('open');
});
document.addEventListener('click', e => {
  if (!menu.contains(e.target)) menu.classList.remove('open');
});
menu.addEventListener('click', e => {
  const item = e.target.closest('.menu-item');
  if (!item) return;
  menu.classList.remove('open');
  const a = item.dataset.action;
  if (a === 'new-tab') newTab();
  else if (a === 'reload') reload();
  else if (a === 'forward') goForward();
  else if (a === 'bookmark') toggleBookmark();
  else if (a === 'home') goHome();
  else if (a === 'clear') {
    state.history = [];
    store.set('history', []);
    toast('История очищена');
  }
});

/* ============================================================
   Запуск
   ============================================================ */
newTab();

/* ============================================================
   Регистрация Service Worker
   ============================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
